<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>用户管理</title>

    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/users.css">
    <link rel="stylesheet" href="css/common.animations.css">
    <link rel="stylesheet" href="css/users.animations.css">
</head>

<body>

    <aside class="app-sidebar">
        <a class="brand" href="/admin" data-admin-nav>N2N User Server<small>管理控制台</small></a>
        <nav class="app-nav" aria-label="主导航">
            <a href="/admin" data-admin-nav>控制台主页</a>
            <a href="/users" data-admin-nav aria-current="page">用户管理</a>
            <a href="/configs" data-admin-nav>用户配置管理</a>
        </nav>
    </aside>

    <header class="app-header">
        <div><h2 class="app-header__title">用户管理</h2><span class="app-header__meta">N2N User Server 管理控制台</span></div>
        <div class="admin-area">
            <button id="AdminButton" class="admin-button" type="button" aria-expanded="false">Admin</button>
            <div id="AdminMenu" class="admin-menu"><button id="LogoutButton" type="button">退出登录</button></div>
        </div>
    </header>


    <main class="app-main">

        <section class="page-container">

            <div class="page-header">

                <div>
                    <h1>用户管理</h1>
                    <p>管理服务器用户账户</p>
                </div>

                <button
                    id="CreateUserButton"
                    class="primary-button"
                    type="button"
                >
                    创建用户
                </button>

            </div>


            <div class="toolbar">

                <input
                    id="SearchInput"
                    type="text"
                    placeholder="搜索用户名"
                >

                <select id="PageSize">

                    <option value="10">10 条 / 页</option>
                    <option value="20">20 条 / 页</option>
                    <option value="50">50 条 / 页</option>
                    <option value="100">100 条 / 页</option>

                </select>

            </div>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>用户名</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>

                    </thead>

                    <tbody id="UserTableBody">
                    </tbody>

                </table>

            </div>


            <div
                id="Pagination"
                class="pagination"
            >
            </div>

        </section>

    </main>


    <footer class="app-footer">
        N2N User Server
    </footer>


    <!-- 创建用户窗口 -->

    <dialog id="CreateUserDialog" class="app-dialog">

        <form id="CreateUserForm">

            <div class="dialog-header">

                <h2>创建用户</h2>

            </div>


            <div class="dialog-content">

                <div class="form-item">

                    <label for="CreateUsername">
                        用户名
                    </label>

                    <input
                        id="CreateUsername"
                        type="text"
                        autocomplete="off"
                    >

                </div>


                <div class="form-item">

                    <label for="CreatePassword">
                        密码
                    </label>

                    <input
                        id="CreatePassword"
                        type="password"
                        autocomplete="new-password"
                    >

                </div>


                <div class="checkbox-item">

                    <input
                        id="CreateEnabled"
                        type="checkbox"
                        checked
                    >

                    <label for="CreateEnabled">
                        启用用户
                    </label>

                </div>

            </div>


            <div class="dialog-footer">

                <button
                    id="CancelCreateUserButton"
                    type="button"
                    class="secondary-button"
                >
                    取消
                </button>

                <button
                    type="submit"
                    class="primary-button"
                >
                    创建
                </button>

            </div>

        </form>

    </dialog>


    <!-- 修改用户窗口 -->

    <dialog id="ReviseUserDialog" class="app-dialog">

        <form id="ReviseUserForm">

            <div class="dialog-header">

                <h2>修改用户</h2>

            </div>


            <div class="dialog-content">

                <div class="form-item">

                    <label for="ReviseUserId">
                        用户 ID
                    </label>

                    <input
                        id="ReviseUserId"
                        type="number"
                        min="1"
                        step="1"
                        readonly
                    >

                </div>


                <div class="form-item">

                    <label for="ReviseUsername">
                        用户名
                    </label>

                    <input
                        id="ReviseUsername"
                        type="text"
                        autocomplete="off"
                    >

                </div>


                <div class="form-item">

                    <label for="RevisePassword">
                        密码
                    </label>

                    <input
                        id="RevisePassword"
                        type="password"
                        autocomplete="new-password"
                        placeholder="留空则不修改密码"
                    >

                </div>


                <div class="checkbox-item">

                    <input
                        id="ReviseEnabled"
                        type="checkbox"
                    >

                    <label for="ReviseEnabled">
                        启用用户
                    </label>

                </div>

            </div>


            <div class="dialog-footer">

                <button
                    id="CancelReviseUserButton"
                    type="button"
                    class="secondary-button"
                >
                    取消
                </button>

                <button
                    type="submit"
                    class="primary-button"
                >
                    保存修改
                </button>

            </div>

        </form>

    </dialog>


    <!-- 错误窗口 -->

    <dialog id="ErrorDialog" class="app-dialog">

        <div class="dialog-content">

            <h2>操作失败</h2>

            <p>
                错误代码：
                <span id="ErrorCode"></span>
            </p>

            <p>
                错误信息：
                <span id="ErrorHint"></span>
            </p>

            <div class="dialog-footer">

                <button
                    data-dialog-close="ErrorDialog"
                    type="button"
                    class="secondary-button"
                >
                    关闭
                </button>

                <button
                    data-dialog-close="ErrorDialog"
                    type="button"
                    class="primary-button"
                >
                    确定
                </button>

            </div>

        </div>

    </dialog>


    <!-- 成功窗口 -->

    <dialog id="SuccessDialog" class="app-dialog">

        <div class="dialog-content">

            <h2>操作成功</h2>

            <p id="SuccessHint"></p>

            <div class="dialog-footer">

                <button
                    data-dialog-close="SuccessDialog"
                    type="button"
                    class="primary-button"
                >
                    确定
                </button>

            </div>

        </div>

    </dialog>


    <script src="js/common.js"></script>
    <script src="js/users.js"></script>

</body>

</html>
