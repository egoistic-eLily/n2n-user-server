<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理控制台</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/common.animations.css">
    <link rel="stylesheet" href="css/admin.animations.css">
</head>
<body>
    <aside class="app-sidebar">
        <a class="brand" href="/admin" data-admin-nav>N2N User Server<small>管理控制台</small></a>
        <nav class="app-nav" aria-label="主导航">
            <a href="/admin" data-admin-nav aria-current="page">控制台主页</a>
            <a href="/users" data-admin-nav>用户管理</a>
            <a href="/configs" data-admin-nav>用户配置管理</a>
        </nav>
    </aside>

    <header class="app-header">
        <div><h1 class="app-header__title">控制台主页</h1><span class="app-header__meta">N2N User Server 管理控制台</span></div>
        <div class="admin-area">
            <button id="AdminButton" class="admin-button" type="button" aria-expanded="false">Admin</button>
            <div id="AdminMenu" class="admin-menu"><button id="LogoutButton" type="button">退出登录</button></div>
        </div>
    </header>

    <main class="app-main">
        <section class="page-container">
            <div class="page-header">
                <div><h1>欢迎回来</h1><p>在这里查看 N2N User Server 的管理概览。</p></div>
            </div>
            <div class="overview-grid">
                <article class="overview-card"><h2>服务器状态</h2><p>待接入</p></article>
                <article class="overview-card"><h2>用户数量</h2><p>暂无数据</p></article>
                <article class="overview-card"><h2>N2N 配置</h2><p>暂无数据</p></article>
            </div>
        </section>
    </main>

    <footer class="app-footer">N2N User Server</footer>

    <dialog id="ErrorDialog" class="app-dialog">
        <div class="dialog-content"><h2>操作失败</h2><p>错误代码：<span id="ErrorCode"></span></p><p>错误信息：<span id="ErrorHint"></span></p></div>
        <div class="dialog-footer"><button data-dialog-close="ErrorDialog" class="primary-button" type="button">确定</button></div>
    </dialog>
    <dialog id="SuccessDialog" class="app-dialog">
        <div class="dialog-content"><h2>操作成功</h2><p id="SuccessHint"></p></div>
        <div class="dialog-footer"><button data-dialog-close="SuccessDialog" class="primary-button" type="button">确定</button></div>
    </dialog>

    <script src="js/common.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
