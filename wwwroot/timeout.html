<!DOCTYPE html>

<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Session Timeout</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        font-family: Arial, "Microsoft YaHei", sans-serif;

        background: #f5f6f8;
        color: #333;
    }

    main {
        width: 90%;
        max-width: 420px;

        padding: 40px 32px;

        background: #fff;

        border: 1px solid #e5e5e5;
        border-radius: 8px;

        text-align: center;
    }

    h1 {
        margin: 0 0 12px;

        font-size: 24px;
        font-weight: 500;
    }

    p {
        margin: 0 0 28px;

        color: #777;
        font-size: 14px;
    }

    button {
        padding: 9px 18px;

        background: #fff;
        
        border: 1px solid #dcdcdc;
        border-radius: 6px;

        color: #444;
        font-size: 14px;

        cursor: pointer;
    }

    button:hover {
        background: #f3f3f3;
    }
</style>


</head>

<body>


<main>
    <h1>登录已过期</h1>

    <p>
        当前会话已过期，请重新登录。
    </p>

    <button
        type="button"
        onclick="window.location.href='/admin_login';">
        返回登录
    </button>
</main>


</body>

</html>
